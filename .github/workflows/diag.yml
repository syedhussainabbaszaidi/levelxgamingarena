name: Deploy diagnostics

# Temporary, manual-only diagnostic workflow. Not part of the deployment path.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HOST: ftp.stackcp.com
    steps:
      - name: Endpoint reachability
        run: |
          set -uo pipefail
          echo "Runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          getent hosts "$HOST" || true
          for p in 21 22 990; do
            if timeout 15 bash -c "exec 3<>/dev/tcp/$HOST/$p" 2>/dev/null; then
              echo "::notice::PORT $p OPEN"
            else
              echo "::notice::PORT $p BLOCKED"
            fi
          done

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: SFTP login test (port 22)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          if [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::error::FTP_USERNAME/FTP_PASSWORD secrets missing"
            exit 1
          fi
          cat > "$HOME/.lftprc" <<'EOF'
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"
          set net:max-retries 1
          set net:timeout 25
          EOF
          set +e
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" \
            -e "set cmd:fail-exit yes; pwd; ls -la; bye" "sftp://$HOST:22" 2>&1
          rc=$?
          set -e
          echo "sftp_exit=$rc"
          if [ "$rc" -eq 0 ]; then echo "::notice::SFTP LOGIN OK"; else echo "::error::SFTP LOGIN FAILED (exit $rc)"; fi

      - name: FTPS login test (explicit TLS, port 21)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          cat > "$HOME/.lftprc" <<'EOF'
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          set net:max-retries 1
          set net:timeout 25
          EOF
          set +e
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" \
            -e "set cmd:fail-exit yes; pwd; ls -la; bye" "ftp://$HOST:21" 2>&1
          rc=$?
          set -e
          echo "ftps_exit=$rc"
          if [ "$rc" -eq 0 ]; then echo "::notice::FTPS LOGIN OK"; else echo "::error::FTPS LOGIN FAILED (exit $rc)"; fi

      - name: Inspect deployed app over SSH/SFTP (read-only)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          cat > "$HOME/.lftprc" <<'EOF'
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"
          set net:max-retries 2
          set net:timeout 25
          EOF
          cat > "$RUNNER_TEMP/insp.lftp" <<EOF
          set cmd:fail-exit no
          cls -la public_html/
          cls -la public_html/build/
          cls -la public_html/build/assets/
          cls -la public_html/img/
          cls -la public_html/storage/
          cls -la public_html/storage/logs/
          cls -la public_html/public
          cls -la levelxgamingarena
          get public_html/.env -o $RUNNER_TEMP/app.env
          get public_html/index.php -o $RUNNER_TEMP/deployed-index.php
          get public_html/.htaccess -o $RUNNER_TEMP/deployed-htaccess
          get public_html/version.txt -o $RUNNER_TEMP/deployed-version.txt
          get public_html/storage/logs/laravel.log -o $RUNNER_TEMP/laravel.log
          bye
          EOF
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" \
            -e "source $RUNNER_TEMP/insp.lftp" "sftp://$HOST:22" 2>&1 || true

          echo "===== .env ====="
          if [ -s "$RUNNER_TEMP/app.env" ]; then
            echo "present, $(wc -c < "$RUNNER_TEMP/app.env") bytes"
            grep -oE '^(APP_ENV|APP_DEBUG|APP_URL|APP_KEY|DB_CONNECTION|DB_HOST|DB_PORT|DB_DATABASE|DB_USERNAME|SESSION_DRIVER|CACHE_STORE|LOG_CHANNEL|APP_TIMEZONE)=' "$RUNNER_TEMP/app.env" | sort -u
            keylen=$(grep -E '^APP_KEY=' "$RUNNER_TEMP/app.env" | sed 's/^APP_KEY=//' | tr -d '\r\n' | wc -c)
            echo "APP_KEY length: $keylen"
          else
            echo "MISSING"
          fi

          echo "===== deployed public_html/index.php (path lines) ====="
          grep -nE "require|maintenance|bootstrap" "$RUNNER_TEMP/deployed-index.php" 2>/dev/null || echo "index.php not downloaded"

          echo "===== deployed public_html/version.txt ====="
          cat "$RUNNER_TEMP/deployed-version.txt" 2>/dev/null || echo "version.txt not downloaded"

          echo "===== deployed public_html/.htaccess (front-controller lines) ====="
          grep -nE "RewriteRule|RewriteCond.*RewriteRule" "$RUNNER_TEMP/deployed-htaccess" 2>/dev/null || echo ".htaccess not downloaded"

          echo "===== laravel.log (last 120 lines) ====="
          if [ -s "$RUNNER_TEMP/laravel.log" ]; then
            tail -120 "$RUNNER_TEMP/laravel.log"
          else
            echo "no laravel.log downloaded"
          fi

      - name: Plain FTP login test (port 21, no TLS)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          echo "set net:max-retries 1" > "$HOME/.lftprc"
          echo "set net:timeout 15" >> "$HOME/.lftprc"
          set +e
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" \
            -e "set cmd:fail-exit yes; pwd; bye" "ftp://$HOST:21" 2>&1
          rc=$?
          set -e
          echo "ftp_exit=$rc"
          if [ "$rc" -eq 0 ]; then echo "::notice::PLAIN FTP LOGIN OK"; else echo "::notice::PLAIN FTP FAILED (exit $rc)"; fi
