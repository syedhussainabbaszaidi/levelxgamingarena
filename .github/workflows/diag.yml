name: Deploy diagnostics

# Temporary, manual-only diagnostic workflow. Not part of the deployment path.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HOST: ftp.stackcp.com
    steps:
      - name: Endpoint reachability
        run: |
          set -uo pipefail
          echo "Runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          getent hosts "$HOST" || true
          for p in 21 22 990; do
            if timeout 15 bash -c "exec 3<>/dev/tcp/$HOST/$p" 2>/dev/null; then
              echo "::notice::PORT $p OPEN"
            else
              echo "::notice::PORT $p BLOCKED"
            fi
          done

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: SFTP login test (port 22)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          if [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::error::FTP_USERNAME/FTP_PASSWORD secrets missing"
            exit 1
          fi
          cat > "$HOME/.lftprc" <<'EOF'
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"
          set net:max-retries 1
          set net:timeout 25
          EOF
          set +e
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" \
            -e "set cmd:fail-exit yes; pwd; ls -la; bye" "sftp://$HOST:22" 2>&1
          rc=$?
          set -e
          echo "sftp_exit=$rc"
          if [ "$rc" -eq 0 ]; then echo "::notice::SFTP LOGIN OK"; else echo "::error::SFTP LOGIN FAILED (exit $rc)"; fi

      - name: FTPS login test (explicit TLS, port 21)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          cat > "$HOME/.lftprc" <<'EOF'
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          set net:max-retries 1
          set net:timeout 25
          EOF
          set +e
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" \
            -e "set cmd:fail-exit yes; pwd; ls -la; bye" "ftp://$HOST:21" 2>&1
          rc=$?
          set -e
          echo "ftps_exit=$rc"
          if [ "$rc" -eq 0 ]; then echo "::notice::FTPS LOGIN OK"; else echo "::error::FTPS LOGIN FAILED (exit $rc)"; fi

      - name: Plain FTP login test (port 21, no TLS)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          echo "set net:max-retries 1" > "$HOME/.lftprc"
          echo "set net:timeout 15" >> "$HOME/.lftprc"
          set +e
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" \
            -e "set cmd:fail-exit yes; pwd; bye" "ftp://$HOST:21" 2>&1
          rc=$?
          set -e
          echo "ftp_exit=$rc"
          if [ "$rc" -eq 0 ]; then echo "::notice::PLAIN FTP LOGIN OK"; else echo "::notice::PLAIN FTP FAILED (exit $rc)"; fi
