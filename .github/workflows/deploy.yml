name: Build and deploy static Next.js site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-static-production
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  SFTP_HOST: ftp.gb.stackcp.com
  SFTP_PORT: "22"
  FTP_HOST: ftp.gb.stackcp.com
  FTP_PORT: "21"
  SITE_URL: https://www.levelxgamingarena.com

jobs:
  deploy:
    name: Build and deploy static site
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download and optimize unbranded gaming photos
        run: |
          set -euo pipefail
          mkdir -p public/img/site
          curl -fL --retry 3 --retry-delay 2 'https://images.pexels.com/photos/9072394/pexels-photo-9072394.jpeg?auto=compress&cs=tinysrgb&w=2400' -o "$RUNNER_TEMP/arena.jpg"
          curl -fL --retry 3 --retry-delay 2 'https://images.pexels.com/photos/13071304/pexels-photo-13071304.jpeg?auto=compress&cs=tinysrgb&w=2400' -o "$RUNNER_TEMP/pc-setup.jpg"
          curl -fL --retry 3 --retry-delay 2 'https://egw.news/uploads/news/1/17/1772067221455_1772067221455.webp' -o "$RUNNER_TEMP/pc-gaming.webp"
          curl -fL --retry 3 --retry-delay 2 'https://cdn.hstatic.net/products/200000038580/lgps5_fb7b473f596b4ffdb03b2ac360ea1df6.jpg' -o "$RUNNER_TEMP/ps5.jpg"
          curl -fL --retry 3 --retry-delay 2 'https://insure24-live.s3.amazonaws.com/images/uploads/snooker-club-insurance_VKSDMK3.jpg' -o "$RUNNER_TEMP/snooker.jpg"
          curl -fL --retry 3 --retry-delay 2 'https://prtimes.jp/i/87397/1/ogp/d87397-1-9de9cfac4618fac36c94-1.jpg' -o "$RUNNER_TEMP/table-tennis.jpg"
          curl -fL --retry 3 --retry-delay 2 'https://images.trvl-media.com/lodging/38000000/37270000/37268100/37268026/e57e45a7.jpg?impolicy=resizecrop&ra=fill&rh=575&rw=575' -o "$RUNNER_TEMP/pool.jpg"
          curl -fL --retry 3 --retry-delay 2 'https://uts-workshop-ui.vercel.app/assets/img/private.jpg' -o "$RUNNER_TEMP/vip-room.jpg"
          python -m pip install --quiet --break-system-packages Pillow
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageOps
          root = Path(os.environ["RUNNER_TEMP"])
          jobs = [
              (root / "arena.jpg", Path("public/img/site/arena.webp")),
              (root / "pc-setup.jpg", Path("public/img/site/pc-setup.webp")),
              (root / "pc-gaming.webp", Path("public/img/site/pc-gaming.webp")),
              (root / "ps5.jpg", Path("public/img/site/ps5.webp")),
              (root / "snooker.jpg", Path("public/img/site/snooker.webp")),
              (root / "table-tennis.jpg", Path("public/img/site/table-tennis.webp")),
              (root / "pool.jpg", Path("public/img/site/pool.webp")),
              (root / "vip-room.jpg", Path("public/img/site/vip-room.webp")),
          ]
          for source, target in jobs:
              image = ImageOps.exif_transpose(Image.open(source)).convert("RGB")
              image.thumbnail((2200, 1600), Image.Resampling.LANCZOS)
              image.save(target, "WEBP", quality=82, method=6)
              print(f"{target}: {image.width}x{image.height}, {target.stat().st_size} bytes")
          PY

      - name: Cancel superseded Laravel deployment before static upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Stop the legacy Laravel upload and its queued static predecessor so
          # neither can race this replacement deployment.
          for run_id in 45646880738 45643814029; do
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          done
          for run_id in 45646880738 45643814029; do
            for attempt in $(seq 1 36); do
              status=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status' 2>/dev/null || echo completed)
              if [ "$status" = "completed" ]; then break; fi
              sleep 5
            done
            if [ "$status" != "completed" ]; then
              echo "::error::Superseded deployment $run_id did not stop; refusing concurrent FTP upload."
              exit 1
            fi
          done

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static Next.js export
        run: |
          set -euo pipefail
          npm run lint
          npm run build
          test -s out/index.html
          test -s out/about-us/index.html
          test -s out/activities/index.html
          test -s out/gallery/index.html
          test -s out/food-drinks/index.html
          test -s out/contact-us/index.html
          test -s out/packages/index.html
          test -s out/activities/pc-games/index.html
          test -s out/activities/ps5/index.html
          test -s out/activities/premium-snooker-room/index.html
          test -s out/activities/private-table-tennis-room/index.html
          test -s out/robots.txt
          test -s out/sitemap.xml
          test -s out/.htaccess
          if find out -type f -name '*.php' | grep -q .; then
            echo "::error::PHP files found in static export."
            exit 1
          fi
          if find out -type f \( -name '.env' -o -name '.env.*' \) | grep -q .; then
            echo "::error::Environment files found in static export."
            exit 1
          fi
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.images=[]; self.title=False; self.description=False; self.canonical=False
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag == "img": self.images.append(a.get("alt", "").strip())
                  if tag == "title": self.title=True
                  if tag == "meta" and a.get("name") == "description" and a.get("content", "").strip(): self.description=True
                  if tag == "link" and a.get("rel") == "canonical" and a.get("href", "").strip(): self.canonical=True
          pages=list(Path("out").rglob("*.html"))
          assert pages, "No exported HTML pages found"
          for page in pages:
              parser=Audit(); parser.feed(page.read_text(encoding="utf-8"))
              if any(not alt for alt in parser.images): raise SystemExit(f"Missing image alt text: {page}")
              if page.name != "404.html" and not (parser.title and parser.description and parser.canonical):
                  raise SystemExit(f"Missing SEO metadata: {page}")
          print(f"SEO and image-alt audit passed for {len(pages)} HTML files.")
          PY
          echo "Static export verified: $(find out -type f | wc -l) files."

      - name: Check deployment credentials and endpoint
        run: |
          set -euo pipefail
          test -n "${FTP_USERNAME:-}" || { echo "::error::FTP_USERNAME secret is missing."; exit 1; }
          test -n "${FTP_PASSWORD:-}" || { echo "::error::FTP_PASSWORD secret is missing."; exit 1; }
          getent hosts "$SFTP_HOST" >/dev/null
          timeout 20 bash -c "exec 3<>/dev/tcp/$SFTP_HOST/$SFTP_PORT" || true
          timeout 20 bash -c "exec 3<>/dev/tcp/$FTP_HOST/$FTP_PORT" || true

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy static files to cPanel
        run: |
          set -euo pipefail
          cat > "$HOME/.lftprc" <<'LFTPRC'
          set net:timeout 60
          set net:max-retries 3
          set net:persist-retries 3
          set net:reconnect-interval-base 10
          set net:reconnect-interval-max 40
          set mirror:parallel-transfer-count 1
          set cmd:fail-exit yes
          LFTPRC

          cat > "$RUNNER_TEMP/deploy.lftp" <<'LFTP'
          set cmd:fail-exit yes
          mirror -R --delete --verbose=1 \
            -X .env -X '.env.*' \
            -X database -X 'database/*' \
            -X storage -X 'storage/*' \
            -X .ftpquota -X error_log -X php.ini -X .user.ini \
            out/ public_html/
          echo "### DEPLOYED STATIC FILES"
          cls -la public_html/
          echo "### VERIFY STATIC ROUTES"
          cls -la public_html/index.html
          cls -la public_html/about-us/index.html
          cls -la public_html/contact-us/index.html
          cls -la public_html/packages/index.html
          cls -la public_html/activities/pc-games/index.html
          cls -la public_html/.htaccess
          bye
          LFTP

          ok=0
          for scope in sftp ftps ftp; do
            case "$scope" in
              sftp)
                url="sftp://$SFTP_HOST:$SFTP_PORT"
                opts='set sftp:auto-confirm yes; set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25"'
                ;;
              ftps)
                url="ftps://$FTP_HOST:$FTP_PORT"
                opts='set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no'
                ;;
              ftp)
                url="ftp://$FTP_HOST:$FTP_PORT"
                opts='set ftp:ssl-allow no'
                ;;
            esac
            for attempt in 1 2; do
              echo "::group::$scope deploy attempt $attempt/2"
              if LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" "$url" -e "$opts; source $RUNNER_TEMP/deploy.lftp"; then
                echo "::endgroup::"
                ok=1
                break 2
              fi
              echo "::endgroup::"
              sleep $((attempt * 15))
            done
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Static upload failed over SFTP, FTPS and FTP."
            exit 1
          fi

      - name: Verify live static website
        run: |
          set -euo pipefail
          for path in / /about-us/ /activities/ /gallery/ /food-drinks/ /contact-us/ /packages/ /activities/pc-games/ /activities/ps5/ /activities/premium-snooker-room/ /activities/private-table-tennis-room/; do
            code=$(curl -sS -L -o "$RUNNER_TEMP/page.html" -w '%{http_code}' --max-time 30 "$SITE_URL$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$SITE_URL$path returned $code"
              exit 1
            fi
            grep -qi 'Level X' "$RUNNER_TEMP/page.html" || { echo "::error::Expected site content missing at $path"; exit 1; }
          done
          echo "All required static pages returned HTTP 200."

      - name: Commit optimized gaming images to main
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/site/arena.webp public/img/site/pc-setup.webp public/img/site/pc-gaming.webp public/img/site/ps5.webp public/img/site/snooker.webp public/img/site/table-tennis.webp public/img/site/pool.webp public/img/site/vip-room.webp
          if git diff --cached --quiet; then
            echo "Optimized image assets are already committed."
            exit 0
          fi
          git commit -m "Add optimized unbranded gaming images"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          primary_code=$(curl -sS -L -o "$RUNNER_TEMP/primary.html" -w '%{http_code}' --max-redirs 10 --max-time 30 "https://levelxgamingarena.com/" || true)
          echo "https://levelxgamingarena.com/ -> ${primary_code:-request-failed}"
          if [ "$primary_code" != "200" ]; then
            echo "::warning::The apex alias is not resolving cleanly. The canonical www site and all required routes passed; review the apex/CDN redirect configuration separately."
          fi
