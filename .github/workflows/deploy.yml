# Deploys the Laravel application to cPanel via HTTPS API on every push to `main`.
# Uses cPanel's File Manager UAPI over HTTPS (port 2083) — bypasses all FTP/SSH firewall blocks.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   FTP_SERVER   (or FTP_HOST)    cPanel hostname, e.g. server123.stackcp.net
#   FTP_USERNAME (or FTP_USER)    cPanel username
#   FTP_PASSWORD (or FTP_PASS)    cPanel password
#
# Required repository variable (Settings -> Secrets and variables -> Actions -> Variables):
#   FTP_SERVER_DIR   Absolute server path to app root, e.g. /home/username/public_html
#                    (no trailing slash needed). Defaults to /home/<username>/public_html
#
# Optional variable:
#   CPANEL_PORT   cPanel HTTPS port. Defaults to 2083. Try 2096 or 443 if 2083 is blocked.

name: Deploy to cPanel (HTTPS API)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, curl, dom, fileinfo, openssl, pdo, pdo_mysql, pdo_sqlite, tokenizer, zip, gd, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Verify build output
        run: |
          if [ ! -f public/build/manifest.json ]; then
            echo "::error::public/build/manifest.json is missing - the Vite build did not complete."
            exit 1
          fi

      - name: Resolve deployment target
        id: target
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER || secrets.FTP_HOST || vars.FTP_HOST }}
          RAW_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME || secrets.FTP_USER || vars.FTP_USER }}
          RAW_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          RAW_PORT: ${{ vars.CPANEL_PORT }}
        run: |
          set -euo pipefail

          # Clean up server hostname
          server="$(printf '%s' "${RAW_SERVER:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          server="${server#[\"\']}"
          server="${server%[\"\']}"
          case "$server" in
            *://*) server="${server#*://}" ;;
          esac
          server="${server##*@}"
          server="${server%%/*}"
          if printf '%s' "$server" | grep -Eq '^[^:]+:[0-9]+$'; then
            server="${server%%:*}"
          fi
          server="${server%.}"

          if [ -z "$server" ]; then
            echo "::error::FTP_SERVER is not set. Add it under Settings -> Secrets."
            exit 1
          fi

          if ! printf '%s' "$server" | grep -Eq '^[A-Za-z0-9_]([A-Za-z0-9_-]*[A-Za-z0-9_])?(\.[A-Za-z0-9_]([A-Za-z0-9_-]*[A-Za-z0-9_])?)*$'; then
            echo "::error::FTP_SERVER looks invalid: $server"
            exit 1
          fi

          if ! resolved="$(getent ahosts "$server" 2>/dev/null)" || [ -z "$resolved" ]; then
            echo "::error::Cannot resolve $server. Check FTP_SERVER secret."
            exit 1
          fi
          echo "Server resolves to: $(printf '%s\n' "$resolved" | awk 'NR==1{print $1}')"

          username="${RAW_USERNAME:-}"
          if [ -z "$username" ]; then
            echo "::error::FTP_USERNAME is not set."
            exit 1
          fi

          port="${RAW_PORT:-2083}"
          server_dir="${RAW_SERVER_DIR:-/home/${username}/public_html}"
          # Strip trailing slash for tar extraction
          server_dir="${server_dir%/}"

          {
            echo "server=$server"
            echo "port=$port"
            echo "server_dir=$server_dir"
            echo "username=$username"
          } >> "$GITHUB_OUTPUT"

      - name: Verify cPanel credentials
        env:
          CPANEL_PASS: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD || secrets.FTP_PASS }}
        run: |
          if [ -z "${CPANEL_PASS}" ]; then
            echo "::error::FTP_PASSWORD is not configured. Add it under Settings -> Secrets."
            exit 1
          fi

      - name: Create deployment archive
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./storage/logs' \
            --exclude='./storage/framework/cache' \
            --exclude='./storage/framework/sessions' \
            --exclude='./storage/framework/views' \
            --exclude='./bootstrap/cache' \
            --exclude='./public/storage' \
            --exclude='./public/hot' \
            --exclude='./.phpunit.result.cache' \
            --exclude='./.freebuff' \
            --exclude='./tests' \
            --exclude='./phpunit.xml' \
            --exclude='./.editorconfig' \
            --exclude='./.gitattributes' \
            --exclude='./database/*.sqlite' \
            .
          echo "Archive size: $(du -sh /tmp/deploy.tar.gz | cut -f1)"

      - name: Upload archive via cPanel HTTPS API
        env:
          CPANEL_HOST: ${{ steps.target.outputs.server }}
          CPANEL_PORT: ${{ steps.target.outputs.port }}
          CPANEL_USER: ${{ steps.target.outputs.username }}
          CPANEL_PASS: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD || secrets.FTP_PASS }}
          SERVER_DIR: ${{ steps.target.outputs.server_dir }}
        run: |
          set -euo pipefail
          BASE_URL="https://${CPANEL_HOST}:${CPANEL_PORT}"
          AUTH="${CPANEL_USER}:${CPANEL_PASS}"

          echo "Uploading deploy.tar.gz to cPanel home directory..."
          UPLOAD=$(curl -sSf -k \
            -u "${AUTH}" \
            -F "dir=/home/${CPANEL_USER}" \
            -F "file-1=@/tmp/deploy.tar.gz" \
            "${BASE_URL}/execute/Fileman/upload_files")
          echo "Upload result: $UPLOAD"

          # Check upload succeeded
          if ! echo "$UPLOAD" | grep -q '"status":1'; then
            echo "::error::Upload failed. Response: $UPLOAD"
            exit 1
          fi

          echo "Extracting archive to ${SERVER_DIR}..."
          EXTRACT=$(curl -sSf -k \
            -u "${AUTH}" \
            -G \
            --data-urlencode "destdir=${SERVER_DIR}" \
            --data-urlencode "files=[{\"file\":\"/home/${CPANEL_USER}/deploy.tar.gz\"}]" \
            "${BASE_URL}/execute/Fileman/extract")
          echo "Extract result: $EXTRACT"

          if ! echo "$EXTRACT" | grep -q '"status":1'; then
            echo "::error::Extraction failed. Response: $EXTRACT"
            exit 1
          fi

          echo "Cleaning up remote archive..."
          curl -sSf -k \
            -u "${AUTH}" \
            -G \
            --data-urlencode 'files=[{"file":"/home/'"${CPANEL_USER}"'/deploy.tar.gz"}]' \
            "${BASE_URL}/execute/Fileman/delete_files" || true

          echo "Deployment complete!"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### ✅ Deployed to cPanel via HTTPS API"
            echo ""
            echo "- Ref: \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`"
            echo "- Deployed to: \`${{ steps.target.outputs.server_dir }}\`"
            echo ""
            echo "If this release ships migrations, run in cPanel Terminal:"
            echo ""
            echo '```bash'
            echo "php artisan migrate --force"
            echo "php artisan optimize:clear && php artisan optimize"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
