# Save as: .github/workflows/deploy.yml
#
# Push to main -> build (composer + npm) -> upload over FTP to cPanel.
#
# ONE-TIME SETUP
#   1. cPanel -> FTP Accounts -> create an FTP account whose directory is your
#      HOME folder (e.g. /home/<user>), NOT public_html.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions -> add:
#        FTP_SERVER    (e.g. ftp.yourdomain.com)
#        FTP_USERNAME  (e.g. deploy@yourdomain.com)
#        FTP_PASSWORD
#   3. Create .env manually on the server at ~/levelxgamingarena/.env (once).
#
# SERVER LAYOUT RESULT
#   ~/levelxgamingarena/   <- Laravel app (vendor, app, config, ...)
#   ~/public_html/         <- contents of Laravel's public/ (index.php patched)
#
# The action keeps a state file on the server and only uploads changed files,
# so after the first (slow) run, deploys are fast.

name: Build and deploy via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, curl, dom, fileinfo, openssl, pdo, pdo_mysql, tokenizer, zip, gd, bcmath, intl
          coverage: none
          tools: composer:v2

      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json

      # Split the project into "app" (outside web root) and "public" (web root)
      - name: Stage files
        run: |
          mkdir -p .stage/app .stage/public

          # Public files -> public_html
          rsync -a --exclude='storage' --exclude='hot' public/ .stage/public/
          echo "${GITHUB_SHA}" > .stage/public/version.txt
          sed -i "s#__DIR__.'/../#__DIR__.'/../levelxgamingarena/#g" .stage/public/index.php
          grep -q "levelxgamingarena/vendor/autoload.php" .stage/public/index.php

          # App files -> ~/levelxgamingarena
          rsync -a \
            --exclude='.git/' --exclude='.github/' --exclude='.stage/' \
            --exclude='node_modules/' --exclude='tests/' --exclude='public/' \
            --exclude='.env' --exclude='.env.*' \
            --exclude='storage/logs/*' --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' --exclude='storage/framework/views/*' \
            --exclude='bootstrap/cache/*.php' --exclude='database/database.sqlite' \
            ./ .stage/app/

      - name: Upload app (outside web root)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 116.90.103.28
          username: levelxgamingarena.com
          password: ^*&_D[`&hh_P
          protocol: ftps          # change to "ftp" if your host has no TLS
          local-dir: ./.stage/app/
          server-dir: levelxgamingarena/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            storage/**

      - name: Upload public files (web root)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 116.90.103.28
          username: levelxgamingarena.com
          password: ^*&_D[`&hh_P
          protocol: ftps
          local-dir: ./.stage/public/
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            storage/**
            cgi-bin/**
            .well-known/**
